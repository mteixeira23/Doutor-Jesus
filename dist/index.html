<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGI — Fundação Doutor Jesus | Sistema de Gestão Integrada</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/assets/index-BRVr_DWV.css">
</head>
<body>
  <div id="root"></div>

  <!-- Scripts colocados no final do body para garantir que o #root já exista no DOM -->
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script type="module" crossorigin src="/assets/index-CA1zPuPl.js"></script>

  <!-- Fallback de Renderização Imediata -->
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var rootDiv = document.getElementById('root');
        if (rootDiv && rootDiv.children.length === 0) {
          console.warn("React root container empty. Triggering SGI UI rendering engine...");
          if (window.ui && typeof window.ui.renderApp === 'function') {
            window.ui.renderApp();
          }
        }
      }, 300);
    });
  </script>
</body>
</html>
