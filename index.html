<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGI - Fundacao Doutor Jesus | Sistema de Gestao Integrada</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- System Stylesheet Absolute Path -->
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    /* Clean fallback styles */
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Pure ES6 Application Scripts -->
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>

  <!-- Instant Initialization Engine -->
  <script>
    (function executeImmediateRender() {
      function run() {
        if (window.ui && typeof window.ui.renderApp === 'function') {
          try { window.ui.renderApp(); } catch(e) { console.error(e); }
        }
      }
      run();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      }
      window.addEventListener('load', run);
      setTimeout(run, 50);
      setTimeout(run, 200);
    })();
  </script>
</body>
</html>
