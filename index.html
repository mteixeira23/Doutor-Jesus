<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGI - Fundação Doutor Jesus | Sistema de Gestão Integrada</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Script de Reparo Automático do LocalStorage para evitar TypeError: Cannot read properties of undefined (reading id) -->
  <script>
    (function autoRepairStorage() {
      try {
        var sampleAcolhidos = [
          { id: "FDJ-2026-001", nome: "Lucas Silva Santos", cpf: "123.456.789-00", rg: "14.587.963-00", status: "ativo", leito: "Leito A-101 (Térreo PCD)", oficina: "Oficina de Elétrica", dieta: "Normal" },
          { id: "FDJ-2026-002", nome: "Mateus Santos Oliveira", cpf: "987.654.321-11", rg: "12.365.478-99", status: "triagem", leito: "Leito B-205", oficina: "Horta Orgânica FDJ", dieta: "Hipossódica (Pressão Alta)" }
        ];

        var keys = ['sgi_fdj_acolhidos', 'sgi_fdj_acolhidos_v1', 'acolhidos'];
        keys.forEach(function(k) {
          var val = localStorage.getItem(k);
          if (!val || val === '[]' || val === 'null' || val === 'undefined') {
            localStorage.setItem(k, JSON.stringify(sampleAcolhidos));
          }
        });
      } catch(e) {
        console.error("Storage auto-repair error:", e);
      }
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
