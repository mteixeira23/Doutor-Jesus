Vitais ? acolhido.prontuario.sinaisVitais.pa : '120x80 mmHg'}</p>             <p style="font-size: 0.9rem; margin-bottom: 0.25rem;"><strong>Frequncia Cardaca:</strong> \${acolhido.prontuario && acolhido.prontuario.sinaisVitais ? acolhido.prontuario.sinaisVitais.fc : '76 bpm'}</p>             <p style="font-size: 0.9rem; margin-bottom: 0.25rem;"><strong>Glicemia:</strong> \${acolhido.prontuario && acolhido.prontuario.sinaisVitais ? acolhido.prontuario.sinaisVitais.glicemia : '94 mg/dL'}</p>           </div>         </div>       `;     }      if (this.activeMod8Tab === 'mod8_pti') {       return `         <div class="card" style="background: #fff;">           <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">             2.  Plano Teraputico Individual (PTI RDC 29 ANVISA)           </h3>           <p style="font-size: 0.9rem;">Evoluo contnua das 4 fases da ANVISA para o acolhido <strong>\${acolhido.nome}</strong>.</p>           <div class="card" style="background: #f8fafc; border: 1px solid #e2e8f0; margin-top: 1rem;">             <span class="badge badge-success">Fase Atual: Fase 3 de 4</span>           </div>         </div>       `;     }      if (this.activeMod8Tab === 'mod8_aprazamento') {       return `         <div class="card" style="background: #fff;">           <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">             3.  Aprazamento de Medicamentos (Dra. Ana Paula)           </h3>           <p style="font-size: 0.9rem;">Horrios de administrao medicamentosa para <strong>\${acolhido.nome}</strong>.</p>         </div>       `;     }      if (this.activeMod8Tab === 'mod8_evolucoes') {       return `         <div class="card" style="background: #fff;">           <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">             4.  Feed de Evolues Clnicas           </h3>           <p style="font-size: 0.9rem;">Histrico de pareceres da Psicologia, Enfermagem e Servio Social.</p>         </div>       `;     }      if (this.activeMod8Tab === 'mod8_odonto') {       return `         <div class="card" style="background: #fff;">           <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">             5.  Odontologia & Autoestima           </h3>           <p style="font-size: 0.9rem;">Avaliao odontolgica de admisso para <strong>\${acolhido.nome}</strong>.</p>         </div>       `;     }      return `       <div class="card" style="background: #fff;">         <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">           6.  Regulao SAMU 192 & Primeiro Socorros         </h3>         <p style="font-size: 0.9rem;">Protocolo de emergncia da Enfermaria FDJ (Galpo E).</p>       </div>     `;   }    selecionarAcolhidoProntuario(id) {     this.selectedAcolhidoId = id;     this.renderApp();   }    emitirCertificadoLaborterapia(id) {     window.store.emitirCertificadoLaborterapia(id);     this.renderApp();   }    fecharModal() {     const modalContainer = document.getElementById('modal-container');     modalContainer.innerHTML = '';   } }  window.ui = new UI();
